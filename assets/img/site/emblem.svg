<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none" stroke="currentColor" class="emblem" aria-hidden="true">
  <!-- Anneau des cinq elements, autour du logo de la marque -->
  <g class="emb-spin">
    <circle cx="200" cy="200" r="196" stroke-width="1" opacity=".5" stroke-dasharray="2 7"/>
  </g>
  <circle cx="200" cy="200" r="152" stroke-width="1" opacity=".3"/>
  <!-- Les cinq symboles : eau, terre, bois, vent, feu -->
  <g stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <g class="emb-el emb-eau" transform="translate(200 30) scale(1.35) translate(-12 -12)"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11Z"/></g>
    <g class="emb-el emb-terre" transform="translate(362 147) scale(1.35) translate(-12 -12)"><path d="M3 19 9 9l4 6 3-4 5 8Z"/></g>
    <g class="emb-el emb-bois" transform="translate(300 338) scale(1.35) translate(-12 -12)"><circle cx="12" cy="9" r="5.5"/><path d="M12 21v-6.5M12 17l-3-2.5"/></g>
    <g class="emb-el emb-vent" transform="translate(100 338) scale(1.35) translate(-12 -12)"><path d="M3 9h11a3 3 0 1 0-3-3M3 15h15a3 3 0 1 1-3 3M3 12h7"/></g>
    <g class="emb-el emb-feu" transform="translate(38 147) scale(1.35) translate(-12 -12)"><path d="M12 21c4 0 7-3 7-7 0-5-5-7-5-11-3 2-4 5-4 7-1-1-2-2-2-4-2 2-3 5-3 8 0 4 3 7 7 7Z"/></g>
  </g>
</svg>
